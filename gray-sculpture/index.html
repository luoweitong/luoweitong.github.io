<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151713" />
    <meta name="description" content="鹊栖桃枝灰塑数字展陈：白模三维旋转与实物高清细节展示。" />
    <title>鹊栖桃枝｜灰塑 VR 数字展陈</title>
    <script type="module" crossorigin src="/gray-sculpture/assets/index-BrY5aw_H.js"></script>
    <link rel="stylesheet" crossorigin href="/gray-sculpture/assets/index-Dkn3_Gwk.css">
  </head>
  <body>
    <main class="app" id="app">
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand" href="#" aria-label="返回展陈首页">
          <span class="brand-mark">灰</span>
          <span>
            <b>鹊栖桃枝</b>
            <small>灰塑数字展陈</small>
          </span>
        </a>
        <div class="exhibit-no" aria-label="展品编号">EXHIBIT · 001</div>
        <button class="icon-button" id="fullscreenButton" aria-label="进入全屏" title="全屏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        </button>
      </header>

      <section class="intro-panel" aria-labelledby="exhibitTitle">
        <div class="eyebrow"><span></span> DIGITAL RELIEF ARCHIVE</div>
        <h1 id="exhibitTitle">鹊栖<br /><em>桃枝</em></h1>
        <p class="intro-copy">一件浮雕，两种观看。<br />从素白塑形到彩绘成品，触摸作品表面的起伏与笔触。</p>
        <dl class="stats">
          <div><dt>浏览模式</dt><dd>双视图</dd></div>
          <div><dt>白模精度</dt><dd>22 万面</dd></div>
          <div><dt>交互方式</dt><dd>720°</dd></div>
        </dl>
      </section>

      <section class="stage" id="stage" aria-label="作品交互展示区">
        <div class="stage-glow" aria-hidden="true"></div>

        <div class="model-view is-active" id="modelView">
          <canvas id="modelCanvas" aria-label="可旋转的白模三维模型"></canvas>
          <div class="model-loader" id="modelLoader" role="status">
            <div class="loader-orbit"><i></i></div>
            <span>正在唤醒白模</span>
            <small id="loadProgress">0%</small>
          </div>
          <div class="gesture-hint" id="modelHint">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 14V8a2 2 0 0 1 4 0v5-7a2 2 0 0 1 4 0v7-5a2 2 0 0 1 4 0v8.5c0 6-3.5 9.5-8.5 9.5-3.3 0-5.2-1.4-7-3.8l-3-4.2a2 2 0 0 1 3.2-2.4L11 19"/></svg>
            拖拽旋转 · 滚轮缩放
          </div>
        </div>

        <div class="photo-view" id="photoView" aria-hidden="true">
          <div class="photo-viewport" id="photoViewport">
            <img id="heroPhoto" src="./assets/real/real_06.jpg" alt="彩绘完成后的鹊栖桃枝灰塑实物全貌" draggable="false" />
            <div class="photo-shade" aria-hidden="true"></div>
          </div>
          <div class="photo-counter"><span id="photoIndex">01</span><i></i><span>06</span></div>
          <p class="photo-caption" id="photoCaption">完整实物 · 正面全貌</p>
        </div>

        <div class="mode-switch" role="tablist" aria-label="展示模式">
          <button class="mode-button is-active" data-mode="model" role="tab" aria-selected="true">
            <span>01</span><b>白模 · 三维</b><small>自由旋转</small>
          </button>
          <button class="mode-button" data-mode="photo" role="tab" aria-selected="false">
            <span>02</span><b>实物 · 三维</b><small>彩塑旋转</small>
          </button>
        </div>

        <div class="view-controls" id="modelControls" aria-label="三维视图控制">
          <button id="autoRotateButton" class="control-button is-active" title="自动旋转">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M18.5 9A7 7 0 0 0 6 7M5.5 15A7 7 0 0 0 18 17"/></svg>
            <span>自转</span>
          </button>
          <button id="resetModelButton" class="control-button" title="复位模型">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.7 15a7 7 0 1 0 .4-7.4L4 10"/></svg>
            <span>复位</span>
          </button>
          <button id="openWhiteGallery" class="control-button" title="查看白模实拍">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="m3 16 5-5 4 4 3-3 6 6M16.5 8.5h.01"/></svg>
            <span>实拍</span>
          </button>
        </div>

        <div class="view-controls photo-controls" id="photoControls" aria-label="实物照片控制">
          <button id="zoomOutButton" class="control-button" title="缩小">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M16 16l5 5"/></svg><span>缩小</span>
          </button>
          <button id="zoomInButton" class="control-button" title="放大">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M16 16l5 5"/></svg><span>放大</span>
          </button>
          <button id="resetPhotoButton" class="control-button" title="复位照片">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.7 15a7 7 0 1 0 .4-7.4L4 10"/></svg><span>复位</span>
          </button>
        </div>
      </section>

      <aside class="detail-rail" id="detailRail" aria-label="实物细节导航">
        <div class="rail-heading"><span>彩塑细节</span><small>SELECT A VIEW</small></div>
        <div class="thumbnail-list" id="realThumbnails"></div>
      </aside>

      <footer class="footer-note">
        <span>鼠标 / 触屏均可操作</span>
        <span class="footer-line"></span>
        <span>数字化留存 · 2026</span>
      </footer>

      <dialog class="gallery-dialog" id="whiteGallery">
        <div class="gallery-shell">
          <header>
            <div><small>PROCESS ARCHIVE</small><h2>白模实拍档案</h2></div>
            <button class="dialog-close" id="closeWhiteGallery" aria-label="关闭图库">×</button>
          </header>
          <div class="gallery-grid" id="whiteGalleryGrid"></div>
        </div>
      </dialog>

      <dialog class="gallery-dialog" id="realGallery">
        <div class="gallery-shell">
          <header>
            <div><small>PAINTED RELIEF ARCHIVE</small><h2>实物彩绘档案</h2></div>
            <button class="dialog-close" id="closeRealGallery" aria-label="关闭图库">×</button>
          </header>
          <div class="gallery-grid real-gallery-grid" id="realGalleryGrid"></div>
        </div>
      </dialog>
    </main>
  </body>
</html>
